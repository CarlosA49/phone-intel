[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-intel"
version = "3.0.0"
description = "Hacker-themed phone-number intelligence — registration metadata only, no owner ID or live tracking."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["phone", "osint", "libphonenumber", "cli", "intelligence", "phonenumbers"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "phonenumbers>=9.0",
    "rich>=13.0",
    "qrcode>=7.0",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["flask>=3.0"]

[project.scripts]
phone-intel = "phone_intel.cli:main"

[tool.setuptools]
packages = ["phone_intel"]
